<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 日式像素数字避难所</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0f1d;
            font-family: sans-serif;
        }
        /* 核心黑科技：通过 CSS 强制让低分辨率的 Canvas 保持像素锐化，不模糊 */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* 浮动提示 */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #5f6a8e;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
        .title {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #8fa0cf;
            font-size: 14px;
            letter-spacing: 4px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="hud">WebGL Pixel Mode // Res: 320x240</div>
    <div class="title">「 暂退代码，静听落樱 」</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 初始化 WebGL 与像素降采样配置 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0f1d);
        scene.fog = new THREE.FogExp2(0x0c0f1d, 0.015);

        // 使用固定低分辨率，模拟 GBA/NDS 时代的经典 3D 像素感
        const PIXEL_WIDTH = 400;
        const PIXEL_HEIGHT = 300;

        // 采用正交相机（Orthographic），完美呈现日式战棋/微缩模型（Diorama）的各向同性视角
        const aspect = window.innerWidth / window.innerHeight;
        const d = 10;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(12, 10, 12);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(PIXEL_WIDTH, PIXEL_HEIGHT, false); // 关键：渲染小分辨率
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap; // 像素风硬阴影
        document.body.appendChild(renderer.domElement);

        // --- 2. 材质与调色板 (平滑着色关闭，保留低维面片感)
        const materials = {
            island: new THREE.MeshLambertMaterial({ color: 0x1a233a, flatShading: true }),
            grass: new THREE.MeshLambertMaterial({ color: 0x223e4a, flatShading: true }),
            torii: new THREE.MeshLambertMaterial({ color: 0x8f2d34, flatShading: true }),
            toriiTop: new THREE.MeshLambertMaterial({ color: 0x181a24, flatShading: true }),
            leaves: new THREE.MeshLambertMaterial({ color: 0xd47394, flatShading: true }),
            trunk: new THREE.MeshLambertMaterial({ color: 0x2d212f, flatShading: true }),
            lantern: new THREE.MeshLambertMaterial({ color: 0x47516f, flatShading: true }),
            core: new THREE.MeshBasicMaterial({ color: 0xffdf6d }) // 灯芯自发光
        };

        // 场景主旋转容器
        const world = new THREE.Group();
        scene.add(world);

        // --- 3. 构造像素微缩景观 (Voxel Style) ---

        // 浮空岛地基
        const islandGeo = new THREE.BoxGeometry(12, 2, 12);
        const island = new THREE.Mesh(islandGeo, materials.island);
        island.position.y = -1;
        island.receiveShadow = true;
        world.add(island);

        const grassGeo = new THREE.BoxGeometry(11.5, 0.4, 11.5);
        const grass = new THREE.Mesh(grassGeo, materials.grass);
        grass.position.y = 0.2;
        grass.receiveShadow = true;
        world.add(grass);

        // 像素鸟居 (Torii Gate)
        const toriiGroup = new THREE.Group();
        const postL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 0.5), materials.torii);
        postL.position.set(-2, 2, 0);
        postL.castShadow = true;
        const postR = postL.clone();
        postR.position.x = 2;
        
        const tie = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.4, 0.4), materials.torii);
        tie.position.set(0, 3.2, 0);
        
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.5, 0.6), materials.toriiTop);
        topBar.position.set(0, 4.0, 0);
        topBar.castShadow = true;

        toriiGroup.add(postL, postR, tie, topBar);
        toriiGroup.position.set(0, 0.4, -2);
        world.add(toriiGroup);

        // 像素樱花树 (Sakura Voxel Tree)
        const treeGroup = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), materials.trunk);
        trunk.position.y = 1.5;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        // 用堆叠的方块模拟像素叶片集群
        const leavesData = [
            { w: 3, h: 1.5, d: 3, x: 0, y: 3, z: 0 },
            { w: 2.2, h: 1.2, d: 2.2, x: 0.5, y: 4, z: -0.5 },
            { w: 1.8, h: 1, d: 4, x: -0.6, y: 2.8, z: 0.3 }
        ];
        leavesData.forEach(data => {
            const leafMesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), materials.leaves);
            leafMesh.position.set(data.x, data.y, data.z);
            leafMesh.castShadow = true;
            treeGroup.add(leafMesh);
        });
        treeGroup.position.set(3.5, 0.4, 2);
        world.add(treeGroup);

        // 日式石灯笼 (Stone Lantern)
        const lanternGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), materials.lantern);
        base.position.y = 0.6;
        base.castShadow = true;
        
        const lightCore = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), materials.core);
        lightCore.position.y = 1.35;
        
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.9), materials.lantern);
        cap.position.y = 1.65;
        cap.castShadow = true;

        lanternGroup.add(base, lightCore, cap);
        lanternGroup.position.set(-2.5, 0.4, 2.5);
        world.add(lanternGroup);

        // --- 4. 灯光系统 (环境静谧蓝 + 暖灯火) ---
        const ambientLight = new THREE.AmbientLight(0x18244b, 1.5);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x718fce, 1.2);
        moonLight.position.set(5, 15, 5);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 256; // 故意给低分辨率阴影贴图，制造颗粒感
        moonLight.shadow.mapSize.height = 256;
        scene.add(moonLight);

        // 灯笼内部的温暖点光源
        const lanternPointLight = new THREE.PointLight(0xffaa33, 2, 8);
        lanternPointLight.position.set(-2.5, 1.75, 2.5);
        lanternPointLight.castShadow = true;
        world.add(lanternPointLight);

        // --- 5. 像素落樱粒子系统 ---
        const petalCount = 35;
        const petalGeo = new THREE.BoxGeometry(0.15, 0.05, 0.15); // 方块像素粒子
        const petals = [];

        for (let i = 0; i < petalCount; i++) {
            const petal = new THREE.Mesh(petalGeo, materials.leaves);
            resetPetal(petal);
            // 随机初始化高度，防止扎堆
            petal.position.y = Math.random() * 6 + 0.4;
            world.add(petal);
            petals.push(petal);
        }

        function resetPetal(mesh) {
            mesh.position.x = Math.random() * 10 - 5;
            mesh.position.y = 6 + Math.random() * 2;
            mesh.position.z = Math.random() * 10 - 5;
            mesh.userData = {
                speedY: 0.02 + Math.random() * 0.02,
                speedX: 0.01 + Math.random() * 0.02,
                rotSpeed: Math.random() * 0.02
            };
        }

        // --- 6. 渲染与动画循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 缓动旋转世界，像一个精致的八音盒
            world.rotation.y = time * 0.06;

            // 模拟灯火的像素微弱闪烁 (Flicker)
            lanternPointLight.intensity = 2.0 + Math.sin(time * 8) * 0.2 + Math.random() * 0.1;

            // 樱花粒子物理更新
            petals.forEach(petal => {
                petal.position.y -= petal.userData.speedY;
                petal.position.x += Math.sin(time + petal.position.y) * 0.005 + petal.userData.speedX * 0.2;
                petal.rotation.x += petal.userData.rotSpeed;
                petal.rotation.y += petal.userData.rotSpeed;

                // 触地重置
                if (petal.position.y < 0.4) {
                    resetPetal(petal);
                }
            });

            renderer.render(scene, camera);
        }

        // 保持视口自适应，但始终维持降采样比例
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
        });

        // 启动数字禅意空间
        animate();
    </script>
</body>
</html>
