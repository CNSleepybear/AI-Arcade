<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 美式公路像素避难所</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0713;
            font-family: monospace;
        }
        /* 依旧是硬核像素对齐：强制低分率不模糊 */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #5d497c;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
        }
        .title-panel {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .title-panel h2 {
            color: #e2bbfd;
            font-size: 15px;
            letter-spacing: 4px;
            font-weight: 400;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.5);
        }
        .title-panel p {
            color: #6d588d;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hud">RETRO AMERICANA MODE // VIEW: 400x300</div>
    <div class="title-panel">
        <h2>「 荒漠公路，微弱霓虹 」</h2>
        <p>TERMINAL 66 // 远离生产环境，发动机已熄火</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 基础场景设置 (美式深夜荒漠色调) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0713); // 极深的荒漠紫
        scene.fog = new THREE.FogExp2(0x0b0713, 0.02);

        const RENDER_W = 400;
        const RENDER_H = 300;

        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = 9;
        const camera = new THREE.OrthographicCamera(-viewSize * aspect, viewSize * aspect, viewSize, -viewSize, 1, 1000);
        camera.position.set(13, 9, 13);
        camera.lookAt(0, 1.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(RENDER_W, RENDER_H, false);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap; 
        document.body.appendChild(renderer.domElement);

        // --- 2. 霓虹与公路调色板材质 ---
        const palette = {
            sand: new THREE.MeshLambertMaterial({ color: 0x211729, flatShading: true }),       // 荒漠夜沙
            road: new THREE.MeshLambertMaterial({ color: 0x14101e, flatShading: true }),       // 柏油公路
            dinerWall: new THREE.MeshLambertMaterial({ color: 0xd9cbd5, flatShading: true }),  // 汽车旅馆白墙
            dinerRoof: new THREE.MeshLambertMaterial({ color: 0x3d2940, flatShading: true }),  // 棕色大平顶
            truckBody: new THREE.MeshLambertMaterial({ color: 0xb63737, flatShading: true }),  // 复古皮卡红
            truckWheel: new THREE.MeshLambertMaterial({ color: 0x09070c, flatShading: true }), // 轮胎黑
            cactus: new THREE.MeshLambertMaterial({ color: 0x244235, flatShading: true }),     // 晶格仙人掌
            
            // 霓虹自发光材质
            neonPink: new THREE.MeshBasicMaterial({ color: 0xff2a85 }),
            neonCyan: new THREE.MeshBasicMaterial({ color: 0x00f3ff }),
            windowYellow: new THREE.MeshBasicMaterial({ color: 0xffcc44 }) // 旅馆窗户暖光
        };

        const world = new THREE.Group();
        scene.add(world);

        // --- 3. 体素网格搭建 (Voxel Americana) ---

        // 荒漠地基
        const sandMesh = new THREE.Mesh(new THREE.BoxGeometry(11, 1.5, 11), palette.sand);
        sandMesh.position.y = -0.75;
        sandMesh.receiveShadow = true;
        world.add(sandMesh);

        // 66号公路切片
        const roadMesh = new THREE.Mesh(new THREE.BoxGeometry(11, 0.1, 3.5), palette.road);
        roadMesh.position.set(0, 0.05, 3.5);
        roadMesh.receiveShadow = true;
        world.add(roadMesh);

        // 汽车旅馆/小油站小屋 (The Route 66 Cabin)
        const cabin = new THREE.Group();
        const mainWall = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.5, 3.5), palette.dinerWall);
        mainWall.position.y = 1.25;
        mainWall.castShadow = true;
        mainWall.receiveShadow = true;
        cabin.add(mainWall);

        // 平屋顶
        const roof = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.3, 4.0), palette.dinerRoof);
        roof.position.y = 2.65;
        roof.castShadow = true;
        cabin.add(roof);

        // 温暖的方块大飘窗 (深夜有人值班的灯光)
        const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 0.1), palette.windowYellow);
        windowMesh.position.set(0.8, 1.2, 1.76);
        cabin.add(windowMesh);

        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.1), palette.dinerRoof);
        doorMesh.position.set(-1.2, 0.8, 1.76);
        cabin.add(doorMesh);

        cabin.position.set(-2, 0, -1.5);
        world.add(cabin);

        // 巨大的美式复古霓虹灯牌 (Classic Neon Sign Structure)
        const signGroup = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 5.0, 0.2), palette.dinerRoof);
        pole.position.y = 2.5;
        pole.castShadow = true;
        signGroup.add(pole);

        // 看板外框 (粉色霓虹)
        const signFrame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 0.4), palette.neonPink);
        signFrame.position.y = 4.6;
        signGroup.add(signFrame);

        // 看板内嵌核心 (蓝色霓虹)
        const signCore = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.0, 0.5), palette.neonCyan);
        signCore.position.y = 4.6;
        signGroup.add(signCore);

        // 顶部的V型美式尾翼装饰
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.2), palette.neonPink);
        wingL.position.set(0.6, 5.5, 0);
        wingL.rotation.z = 0.4;
        const wingR = wingL.clone();
        wingR.position.x = -0.6;
        wingR.rotation.z = -0.4;
        signGroup.add(wingL, wingR);

        signGroup.position.set(3.5, 0, -1.5);
        world.add(signGroup);

        // 复古美式方头皮卡车 (Classic Voxel Pickup Truck)
        const truck = new THREE.Group();
        
        // 车身底盘
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.3, 1.3), palette.dinerRoof);
        chassis.position.y = 0.25;
        truck.add(chassis);

        // 前车头
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 1.2), palette.truckBody);
        hood.position.set(0.9, 0.65, 0);
        hood.castShadow = true;
        truck.add(hood);

        // 驾驶舱
        const cab = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 1.1), palette.truckBody);
        cab.position.set(-0.05, 1.1, 0);
        cab.castShadow = true;
        truck.add(cab);
        
        // 车窗像素块
        const truckWin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 1.16), palette.road);
        truckWin.position.set(-0.05, 1.2, 0);
        truck.add(truckWin);

        // 后车斗
        const bed = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.6, 1.2), palette.truckBody);
        bed.position.set(-1.05, 0.6, 0);
        bed.castShadow = true;
        truck.add(bed);

        // 4个纯方块黑轮胎
        const wheelsData = [
            {x: 0.8, z: 0.65}, {x: 0.8, z: -0.65},
            {x: -0.8, z: 0.65}, {x: -0.8, z: -0.65}
        ];
        wheelsData.forEach(w => {
            const wheel = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.2), palette.truckWheel);
            wheel.position.set(w.x, 0.25, w.z);
            truck.add(wheel);
        });

        // 停靠在公路边
        truck.position.set(0, 0.05, 3.5);
        truck.rotation.y = -0.15; // 稍微停歪一点，更有故事感
        world.add(truck);

        // 晶格仙人掌群 (Voxel Saguaro Cacti)
        function createCactus(cx, cz, cHeight) {
            const cactusGroup = new THREE.Group();
            const mainStem = new THREE.Mesh(new THREE.BoxGeometry(0.3, cHeight, 0.3), palette.cactus);
            mainStem.position.y = cHeight / 2;
            mainStem.castShadow = true;
            cactusGroup.add(mainStem);

            // 左右手臂分叉
            if (cHeight > 1.5) {
                const armL_H = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.25), palette.cactus);
                armL_H.position.set(-0.3, cHeight * 0.6, 0);
                const armL_V = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.6, 0.25), palette.cactus);
                armL_V.position.set(-0.5, cHeight * 0.6 + 0.2, 0);
                cactusGroup.add(armL_H, armL_V);
            }
            cactusGroup.position.set(cx, 0, cz);
            return cactusGroup;
        }
        world.add(createCactus(-4, -3, 2.4));
        world.add(createCactus(2, -4, 1.8));
        world.add(createCactus(-4.5, 1, 1.5));

        // --- 4. 动态大漠风沙粒子 (Desert Dust Motes) ---
        const dustCount = 30;
        const dustParticles = [];
        const dustGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const dustMat = new THREE.MeshBasicMaterial({ color: 0x9d72b5 }); // 带夜光的紫色沙尘

        for (let i = 0; i < dustCount; i++) {
            const dust = new THREE.Mesh(dustGeo, dustMat);
            dust.position.set(
                Math.random() * 12 - 6,
                Math.random() * 5 + 0.2,
                Math.random() * 12 - 6
            );
            dust.userData = {
                speedX: -(0.03 + Math.random() * 0.04), // 统一往左侧吹刮
                oscillateSpeed: Math.random() * 3,
                amplitude: 0.01 + Math.random() * 0.01
            };
            world.add(dust);
            dustParticles.push(dust);
        }

        // --- 5. 光影环境系统 (赛博朋克霓虹光冲撞) ---
        const ambientLight = new THREE.AmbientLight(0x100a1c, 2.5); // 全局昏暗夜光
        scene.add(ambientLight);

        // 霓虹灯牌发射的粉色/蓝色混合强光
        const neonLightPink = new THREE.PointLight(0xff0077, 3.0, 8);
        neonLightPink.position.set(3.5, 4.6, -1.0);
        neonLightPink.castShadow = true;
        neonLightPink.shadow.mapSize.width = 128;
        world.add(neonLightPink);

        // 旅馆窗户透出的温暖黄光
        const cabinLight = new THREE.PointLight(0xffaa11, 2.0, 5);
        cabinLight.position.set(-1.2, 1.2, 1.0);
        world.add(cabinLight);

        // --- 6. 核心渲染轴与美式霓虹故障闪烁逻辑 ---
        const clock = new THREE.Clock();

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            const elapsed = clock.getElapsedTime();

            // 缓动旋转底盘
            world.rotation.y = elapsed * 0.05;

            // 【黑科技】高拟真美式霓虹灯故障率闪烁算法
            // 基础正弦波动 + 随机离散噪声，模拟老旧变压器接触不良的效果
            let neonIntensity = 3.0 + Math.sin(elapsed * 2.0) * 0.3;
            
            // 5%的概率发生瞬间短暂熄灭（Flicker Burst）
            if (Math.random() > 0.96) {
                neonIntensity = 0.2; 
                palette.neonPink.color.setHex(0x4a122c); // 变为暗色没通电状态
                palette.neonCyan.color.setHex(0x0c323a);
            } else {
                palette.neonPink.color.setHex(0xff2a85); // 正常高亮
                palette.neonCyan.color.setHex(0x00f3ff);
            }
            neonLightPink.intensity = neonIntensity;

            // 荒漠风沙横向位移更新
            dustParticles.forEach(dust => {
                dust.position.x += dust.userData.speedX;
                // y轴方向做波浪形上下漂浮
                dust.position.y += Math.sin(elapsed * dust.userData.oscillateSpeed) * dust.userData.amplitude;

                // 飞出边界重置
                if (dust.position.x < -6) {
                    dust.position.x = 6;
                    dust.position.y = Math.random() * 5 + 0.2;
                    dust.position.z = Math.random() * 12 - 6;
                }
            });

            renderer.render(scene, camera);
        }

        // 屏幕缩放自适应
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
        });

        // 终点站，启动！
        renderLoop();
    </script>
</body>
</html>
